# プルリクエストとmainへのpushで、リント、型チェック、テストを実行する。
# 本番への自動デプロイは、Cloudflareのリソースを作った後に別のワークフローとして追加する
# (仕様: docs/spec/architecture.md「開発と運用」)。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # package.json の packageManager に書いたバージョンのpnpmを使う
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
